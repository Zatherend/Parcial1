<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesar Pago - Tienda Berries</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-danger" href="index.html">Wiki Mugiwara</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="carrito.html">← Volver al Carrito</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg p-4">
                    <h2 class="text-center mb-4 text-danger fw-bold">Finalizar Compra de Recompensas</h2>
                    
                    <form id="form-pago">
                        <h4 class="mb-3">1. Datos de Envío (Grand Line)</h4>
                        <div class="mb-3">
                            <label for="nombrePago" class="form-label">Nombre del Comprador / Capitán</label>
                            <input type="text" class="form-control" id="nombrePago" placeholder="Ej. Monkey D. Luffy" required>
                        </div>
                        <div class="mb-3">
                            <label for="direccionPago" class="form-label">Dirección / Isla de Destino</label>
                            <input type="text" class="form-control" id="direccionPago" placeholder="Ej. Thousand Sunny, Ohara" required>
                        </div>

                        <h4 class="mb-3 mt-4">2. Método de Pago (Tesoro de Berries)</h4>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="metodoPago" id="pagoBerries" checked>
                            <label class="form-check-label" for="pagoBerries">
                                Cofre de Berries (Efectivo)
                            </label>
                        </div>
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="radio" name="metodoPago" id="pagoTarjeta">
                            <label class="form-check-label" for="pagoTarjeta">
                                Tarjeta del Banco Mundial
                            </label>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-danger btn-lg">Confirmar y Pagar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('form-pago').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('¡Pago realizado con éxito! Tus carteles de recompensa van en camino a tu barco.');
            localStorage.removeItem('carrito'); // Limpia el carrito
            window.location.href = 'index.html'; // Redirige al inicio
        });
    </script>
</body>
</html>
