<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Wiki Sombrero de Paja</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand" href="index.html">← Volver al Inicio</a>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg p-4" style="background-color: rgba(255, 255, 255, 0.9); border-radius: 12px; border: 2px solid #b71c1c;">
                
                <div class="text-center mb-4">
                    <h2 style="color: #b71c1c; border-bottom: none;">Contacto / Unirse a la Tripulación</h2>
                    <p class="text-muted small">Mándanos un mensaje o inscríbete en el registro de la Marina</p>
                </div>

                <form id="contactForm">
               
                    <div class="mb-3">
                        <label for="nombreInput" class="form-label fw-bold">Nombre o Apodo Pirata</label>
                        <input type="text" class="form-control" id="nombreInput" placeholder="Ej. Monkey D. Luffy" required>
                    </div>
                  
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label fw-bold">Correo Electrónico</label>
                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="tu_correo@grandline.com" required>
                        <div id="emailHelp" class="form-text">Nunca compartiremos tu correo con el Gobierno Mundial.</div>
                    </div>
                 
                    <div class="mb-3">
                        <label for="mensajeInput" class="form-label fw-bold">Mensaje / Sueño</label>
                        <textarea class="form-control" id="mensajeInput" rows="3" placeholder="Cuéntanos cuál es tu sueño..." required></textarea>
                    </div>
                  
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="exampleCheck1" required>
                        <label class="form-check-label text-dark" for="exampleCheck1">Acepto los términos de navegación en el Nuevo Mundo</label>
                    </div>
         
                    <div class="d-grid">
                        <button type="submit" class="btn btn-danger btn-lg">Enviar Mensaje</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">© 2026 Wiki Sombrero de Paja / Maximiliano Álvarez</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombreInput').value;
            const email = document.getElementById('exampleInputEmail1').value;
            const mensaje = document.getElementById('mensajeInput').value;


            const miCorreo = "max.alvarezn@duocuc.cl"; 

            const asunto = encodeURIComponent(`Nuevo mensaje de ${nombre} - Wiki Sombrero de Paja`);
            const cuerpo = encodeURIComponent(`Nombre: ${nombre}\nCorreo de contacto: ${email}\n\nMensaje:\n${mensaje}`);

            window.location.href = `mailto:${miCorreo}?subject=${asunto}&body=${cuerpo}`;
        });
    </script>
</body>
</html>
