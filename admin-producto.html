<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Nuevo Producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            overflow-x: hidden;
        }
        .sidebar {
            min-height: 100vh;
            background-color: #212529;
            color: white;
        }
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
        }
        .sidebar .nav-link:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .sidebar .nav-link.active {
            color: #fff;
            background-color: #0d6efd;
        }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">

            <aside class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3 bg-dark text-white min-vh-100">
    <div class="d-flex align-items-center mb-4 text-white text-decoration-none">
        <span class="fs-4 fw-bold">Admin Mugiwara</span>
    </div>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item mb-2">
            <a href="admin-producto.html" class="nav-link text-white active">
                📦 Mantenedor Productos
            </a>
        </li>
        <li class="nav-item mb-2">
            <a href="admin-usuario.html" class="nav-link text-white">
                👥 Mantenedor Usuarios
            </a>
        </li>
        <li class="nav-item mt-4">
            <a href="index.html" class="nav-link text-danger fw-bold">
                ← Volver a la Tienda
            </a>
        </li>
    </ul>
</aside>


            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Nuevo Producto</h1>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="productForm" class="row g-3">
                            <div class="col-md-4">
                                <label for="codigo" class="form-label">Código de producto</label>
                                <input type="text" class="form-control" id="codigo" placeholder="Ej: PROD-001" required>
                            </div>
                            <div class="col-md-8">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Nombre del producto" required>
                            </div>
                            <div class="col-12">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="descripcion" rows="3" placeholder="Detalles del producto..."></textarea>
                            </div>
                            <div class="col-md-4">
                                <label for="precio" class="form-label">Precio</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" step="0.01" class="form-control" id="precio" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label for="stock" class="form-label">Stock</label>
                                <input type="number" class="form-control" id="stock" required>
                            </div>
                            <div class="col-md-4">
                                <label for="categoria" class="form-label">Categoría</label>
                                <select id="categoria" class="form-select" required>
                                    <option value="" selected disabled>Seleccione una categoría</option>
                                    <option value="electronica">Electrónica</option>
                                    <option value="hogar">Hogar</option>
                                    <option value="ropa">Ropa</option>
                                    <option value="deportes">Deportes</option>
                                </select>
                            </div>
                            <div class="col-12 mt-4 d-flex justify-content-end">
                                <button type="reset" class="btn btn-outline-secondary me-2">Cancelar</button>
                                <button type="submit" class="btn btn-primary">Guardar Producto</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="admin.js"></script>
</body>
</html>
