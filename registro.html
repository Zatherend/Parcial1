<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Registro de Usuario</h4>
                    </div>
                    <div class="card-body">
                        <form id="form-registro" novalidate>
                         
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre" name="nombre">
                                <small class="text-danger error-msg" style="display: none;"></small>
                            </div>

                        
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="correo" name="correo">
                                <small class="text-danger error-msg" style="display: none;"></small>
                            </div>

                        
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" name="password">
                                <small class="text-danger error-msg" style="display: none;"></small>
                            </div>

                          
                            <div class="mb-3">
                                <label for="confirmar-password" class="form-label">Confirmar Contraseña</label>
                                <input type="password" class="form-control" id="confirmar-password" name="confirmar-password">
                                <small class="text-danger error-msg" style="display: none;"></small>
                            </div>

                          
                            <div class="mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono">
                                <small class="text-danger error-msg" style="display: none;"></small>
                            </div>

                           
                            <div class="mb-3">
                                <label for="region" class="form-label">Región</label>
                                <select class="form-select" id="region" name="region">
                                    <option value="">Seleccione una región</option>
                                    <!-- Opciones cargadas dinámicamente -->
                                </select>
                                <small class="text-danger error-msg" style="display: none;"></small>
                            </div>

                         
                            <div class="mb-3">
                                <label for="comuna" class="form-label">Comuna</label>
                                <select class="form-select" id="comuna" name="comuna">
                                    <option value="">Seleccione una comuna</option>
                                  
                                </select>
                                <small class="text-danger error-msg" style="display: none;"></small>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Registrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   
    <script src="validaciones.js"></script>
</body>
